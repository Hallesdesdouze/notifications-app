name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write       # créer la release et y déposer les fichiers
  id-token: write       # attestation de provenance
  attestations: write

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      VITE_SITE_URL: https://halles-des-douze.fr
      VITE_SOCKET_URL: https://halles-des-douze.fr
      VITE_SOCKET_PATH: /socket.io

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Vérifier que le tag correspond à la version de l'app
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Le tag ${{ github.ref_name }} ne correspond pas à la version v$version de tauri.conf.json"
            exit 1
          }

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler et publier la release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Halles des Douze ${{ github.ref_name }}"
          releaseBody: |
            Application de bureau pour recevoir les notifications Halles des Douze.

            **Installation** : téléchargez le fichier `-setup.exe` ci-dessous.
            Windows SmartScreen peut afficher un avertissement (application non signée) :
            cliquez sur « Informations complémentaires » puis « Exécuter quand même ».

            **Vérifier que l'installeur provient bien de ce dépôt** :
            - empreinte SHA-256 : voir `SHA256SUMS.txt`
            - provenance : `gh attestation verify <fichier>.exe --repo ${{ github.repository }}`
          releaseDraft: true
          prerelease: false

      - name: Attestation de provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Publier les empreintes SHA-256
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe
          $lines = foreach ($f in $files) {
            "$((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower())  $($f.Name)"
          }
          $lines | Set-Content -Encoding utf8 SHA256SUMS.txt
          gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --clobber